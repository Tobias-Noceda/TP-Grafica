<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>Astillero orbital</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background-color: #000000;
				color: white;
				font-family: Arial, Helvetica, sans-serif;
			}

			#container3D {
				width: 100%;
				height: 100%;
			}

			#walk-hint {
				display: none;
				position: fixed;
				left: 50%;
				bottom: 24px;
				transform: translateX(-50%);
				padding: 8px 14px;
				border-radius: 6px;
				background: rgba(0, 0, 0, 0.6);
				font-size: 14px;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="container3D"></div>
		<div id="walk-hint">Click to look around · WASD to walk · Shift to run · Esc to release the mouse</div>
		<script type="module" src="/src/app/main.js"></script>
	</body>
</html>
